# Laeuft als Client am Haupt-PipeWire (Muster wie filter-chain.conf) und haengt
# einen Sink ein, der nach PulseAudio weiterleitet. PulseAudio behaelt den HAL.
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
      args = { }
      flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-pulse-tunnel
      args = {
          tunnel.mode = sink
          pulse.server.address = "unix:/run/user/32011/pulse/native"
          node.name        = "furios_pa_tunnel"
          node.description = "PulseAudio (Tunnel)"
          audio.rate       = 48000
          audio.channels   = 2
      } }
]
