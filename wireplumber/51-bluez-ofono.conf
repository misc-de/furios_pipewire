# Bluetooth: which backend owns hands-free (HFP).
#
# The point is not that it works - on this device it does not work at all,
# not even in the shipped configuration:
#
#   - ofono owns HFP. It has hfp_ag_bluez5 built in and registers
#     /bluetooth/profile/hfp_ag with BlueZ. Next to it PipeWire's native
#     backend fails with "listen(): Address already in use" and
#     "RegisterProfile() failed: org.bluez.Error.NotPermitted".
#   - ofono however never creates a card for the connected headset
#     (HandsfreeAudioManager.GetCards stays empty), not even after a fresh
#     connection.
#   - On the shipped PulseAudio the result is the same: the profile
#     handsfree_head_unit can be selected, the source goes to RUNNING - and
#     delivers 0 bytes; paplay in the other direction blocks. The SCO channel
#     carries no audio to the host.
#   - Consistent with that: the HAL configuration knows BT SCO device ports,
#     but neither our card nor PulseAudio's exposes them. On Android devices
#     SCO runs in hardware between the BT chip and the audio DSP, not through
#     the host.
#
# It still says "native" here, for a different reason than audio through the
# host: only with this backend does the card offer a hands-free profile at
# all, and only then does the headset even establish an SCO channel. The
# Android path needs that channel - the HAL puts the voice path onto the
# Bluetooth PCM line via BT_SCO=on, and that line only carries while the
# connection is up. See "audioctl bt-call".
#
# A2DP (music) is untouched by all of this and works.

# A switch of our own, so that WirePlumber knows the name and wpctl can show
# it. Without a schema entry the setting simply does not exist and every read
# of it comes back empty.
wireplumber.settings.schema = {
  furios.bluetooth-call-routing = {
    name = "Route calls to a Bluetooth headset"
    description = "Put a mobile call on a connected headset automatically (experimental, see droid-bluetooth-call.lua)"
    type = "bool"
    default = false
  }
}

wireplumber.settings = {
  # Do not put calls on the headset by themselves.
  #
  # The idea works on paper and failed in the first real call: callaudiod only
  # knows earpiece and speaker and resets the port during a call,
  # droid-bluetooth-call.lua set it back, and the two took turns two to three
  # times a second. The HAL tore the voice path down and rebuilt it every time
  # (BT_SCO=off, BT_SCO=on, ...), and the call had no audio at all - not on
  # the headset, not on the earpiece, in neither direction. Choosing the
  # earpiece by hand did not help, because the script overrode that too.
  #
  # The script now also gives up after a few rounds of that fight, and waits
  # for the card to go QUIET before touching the Bluetooth side at all -
  # changing the route or the profile while callaudiod is still setting the
  # call up changes the cards underneath it, and its next SelectMode then
  # blocks for 25 seconds with no audio in either direction.
  #
  # A fixed delay was tried first and was not enough: the profile goes to
  # voicecall while the phone is still ringing, so the delay ran out in the
  # middle of callaudiod's work - measured at 14 ms before it set the port it
  # wanted. Waiting for a second in which nothing moves cannot land there.
  #
  # It is still off until it has been shown to work in a real call.
  furios.bluetooth-call-routing = false

  # Do not offer a microphone that delivers nothing.
  #
  # WirePlumber's own description of this setting is "Always show microphone
  # for Bluetooth headsets, and switch to headset mode when recording". While
  # it is on, the bluez monitor keeps a loopback source
  # (bluez_input.<address>) alive even in the A2DP profile, so that opening it
  # switches the card to hands-free. Every recorder therefore lists the
  # headset as a microphone.
  #
  # On this device that microphone is digital silence. Measured on
  # 2026-09-10 with a soundcore Liberty 4 Pro, 3 s at 16 kHz mono:
  #
  #   profile a2dp-sink        48000 samples, 1 distinct value, RMS 0, peak 0
  #   profile headset-head-unit 48000 samples, 1 distinct value, RMS 0, peak 0
  #
  # - the same on the shipped PulseAudio, and the reason is above: SCO does
  # not reach the host here. Picking it means recording nothing, and it looks
  # like it worked.
  #
  # With the setting off the loopback source only exists while the card really
  # is in a hands-free profile. In the A2DP profile - which is where music
  # plays - no headset microphone is offered at all, and a recorder keeps the
  # phone's own. The automatic switch during a call is not affected:
  # droid-bluetooth-call.lua sets the profile itself and does not rely on
  # this. Nor is it a loss otherwise, because the mode it would switch to is
  # the silent one.
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  bluez5.hfphsp-backend = "native"

  # Connect the audio profiles ourselves when only some of them are up.
  #
  # This line used to say "bluez5.reconnect-profiles", which is a PulseAudio
  # name. PipeWire does not know it - not in libspa-bluez5, not in
  # WirePlumber, not anywhere in the installed stack - so it did nothing at
  # all, silently, while its comment claimed otherwise. What actually fixed
  # the audio-gateway trouble was the role list below.
  #
  # The property does exist under another name, and the case it is for is
  # real: leave the card in a hands-free profile, restart WirePlumber, and the
  # A2DP profiles are gone from the card - only "off" and the two headset
  # profiles remain, so music would play in mono at 16 kHz. A manual
  # disconnect and connect brings them back, which is not something to ask of
  # anyone. With this list the monitor asks for the missing role itself.
  #
  # Measured both ways on 2026-09-10, same headset, same sequence - card into
  # headset-head-unit, restart WirePlumber:
  #
  #   without   only "off" and the two headset profiles; A2DP came back only
  #             after a manual disconnect and connect
  #   with      all three A2DP profiles back, and the card picked a2dp-sink
  #             again on its own
  bluez5.auto-connect = [ a2dp_source hfp_ag hsp_ag ]

  # Only the roles a phone actually has.
  #
  # The names are from this device's point of view, the card profiles from the
  # remote's - so the role that produces the profile called "a2dp-sink" (High
  # Fidelity Playback) is a2dp_source: we send, the headset receives. By
  # default the monitor also offers the roles where this device is the headset
  # (a2dp_sink, hfp_hf, hsp_hs). Together they form the card profile
  # "audio-gateway" - and that one has priority 256 against a2dp-sink's 132.
  # When a headset connects on its own, the handsfree side is up first and
  # A2DP is not; WirePlumber then picks the highest-priority profile it can
  # get, which is audio-gateway, and that profile has no sinks and no sources
  # at all. Nothing re-evaluates once A2DP does arrive, so the headset sits
  # there connected and silent, with a tick next to it in the settings.
  #
  # Without those roles the profile does not exist, and the choice is between
  # A2DP and handsfree - which is the choice a phone actually has.
  bluez5.roles = [ a2dp_source hfp_ag hsp_ag ]
}
