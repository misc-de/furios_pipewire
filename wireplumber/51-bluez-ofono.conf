# Bluetooth-Freisprechen (HFP) ueber PipeWires eigenen Backend.
#
# Der naheliegende Gedanke war ofono - auf einem Telefon besitzt es das Modem.
# Es taugt hier aber nicht: ofono hat gar kein org.ofono.Handsfree-Interface
# und meldet unter HandsfreeAudioManager keine Karten, auch nicht bei
# verbundenem Kopfhoerer. Mit dem ofono-Backend bietet die Bluetooth-Karte
# deshalb nur A2DP-Profile - telefonieren ueber den Kopfhoerer ist dann
# unmoeglich, die Ein-/Ausgaenge dafuer existieren gar nicht.
#
# A2DP (Musik) ist von dieser Einstellung unberuehrt.

monitor.bluez.properties = {
  bluez5.hfphsp-backend = "native"
}
