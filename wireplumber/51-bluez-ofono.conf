# Bluetooth-Freisprechen ueber ofono statt ueber PipeWires eigenen Backend.
#
# Auf einem Telefon gehoert die HFP-Rolle ofono: es besitzt das Modem und hat
# das Bluetooth-Profil bereits registriert. PipeWires nativer Backend scheitert
# daneben mit "listen(): Address already in use" und
# "RegisterProfile() failed: org.bluez.Error.NotPermitted" - und WirePlumber
# warnt selbst: "ofono running, but not configured as HFP/HSP backend".
#
# A2DP (Musik) ist davon unberuehrt und laeuft in jedem Fall ueber PipeWire.

monitor.bluez.properties = {
  bluez5.hfphsp-backend = "ofono"
}
