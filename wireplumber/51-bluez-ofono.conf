# Bluetooth: Freisprechen (HFP) bleibt bewusst beim ofono-Backend.
#
# Der Grund ist nicht, dass es damit funktioniert - es funktioniert auf diesem
# Geraet ueberhaupt nicht, auch nicht im Auslieferungszustand:
#
#   - ofono besitzt HFP. Es hat hfp_ag_bluez5 fest eingebaut und registriert
#     /bluetooth/profile/hfp_ag bei BlueZ. PipeWires nativer Backend scheitert
#     daneben an "listen(): Address already in use" und
#     "RegisterProfile() failed: org.bluez.Error.NotPermitted".
#   - ofono legt fuer den verbundenen Kopfhoerer aber keine Karte an
#     (HandsfreeAudioManager.GetCards bleibt leer), auch nach frischer
#     Verbindung nicht.
#   - Auf dem Auslieferungs-PulseAudio ist das Ergebnis dasselbe: das Profil
#     handsfree_head_unit laesst sich waehlen, die Quelle geht auf RUNNING -
#     und liefert 0 Bytes; paplay in die Gegenrichtung blockiert. Der
#     SCO-Kanal traegt keinen Ton zum Rechner.
#   - Passend dazu: die HAL-Konfiguration kennt BT-SCO-Geraeteports, aber
#     weder unsere Karte noch die von PulseAudio fuehren sie. Auf
#     Android-Geraeten laeuft SCO in Hardware zwischen BT-Chip und Audio-DSP,
#     nicht ueber den Rechner.
#
# Mit dem nativen Backend erschienen HFP-Profile, die stumm blieben - und
# WirePlumber schaltete beim ersten Aufnahmeversuch dorthin, was auch die
# Musik verdarb. Der ofono-Backend zeigt sie erst gar nicht an. Sollte ofono
# eines Tages Karten melden, funktioniert HFP damit von selbst.
#
# A2DP (Musik) ist von alldem unberuehrt und funktioniert.

monitor.bluez.properties = {
  bluez5.hfphsp-backend = "ofono"
}
