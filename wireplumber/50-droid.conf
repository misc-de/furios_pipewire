# Droid audio: announce the SPA plugin and load the monitor.
#
# Only effective while WirePlumber is running at all - in the 'standard'
# profile the service is masked, so this file changes nothing there.

context.spa-libs = {
  api.droid.* = droid/libspa-droid
}

wireplumber.components = [
  {
    name = monitors/droid.lua, type = script/lua
    provides = monitor.droid
    requires = [ support.export-core, pw.client-device ]
  }
  {
    name = monitors/droid-input-follows-output.lua, type = script/lua
    provides = policy.droid-input-follows-output
  }
]

wireplumber.profiles = {
  main = {
    monitor.droid = required

    # Pick a headset as the output and its microphone should follow.
    policy.droid-input-follows-output = required

    # The mixer API is how the monitor learns about volume changes. During a
    # call the HAL needs them (set_voice_volume) - the adapter's software gain
    # has nothing to act on there, because no PCM is flowing.
    api.mixer = required

    # The ALSA monitor stays ON - otherwise there would be no USB audio: no
    # USB-C headset, no dock, no DAC. Only the internal card is hidden, and
    # deliberately so (see monitor.alsa.rules below).
  }
}

# The raw ALSA card mt6877-mt6359 is the same device the Android HAL holds
# exclusively. If an application opened it directly there would be a fight
# over the PCM device - so hide it. Everything else (USB!) stays visible.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
      { api.alsa.card.name = "mt6877-mt6359" }
      { alsa.card_name = "mt6877-mt6359" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
