# Droid-Audio: SPA-Plugin bekanntmachen und den Monitor laden.
#
# Nur wirksam, wenn WirePlumber ueberhaupt laeuft - im Profil 'standard' ist
# der Dienst maskiert, dort aendert diese Datei also nichts.

context.spa-libs = {
  api.droid.* = droid/libspa-droid
}

wireplumber.components = [
  {
    name = monitors/droid.lua, type = script/lua
    provides = monitor.droid
    requires = [ support.export-core, pw.client-device ]
  }
  {
    name = monitors/droid-input-follows-output.lua, type = script/lua
    provides = policy.droid-input-follows-output
  }
]

wireplumber.profiles = {
  main = {
    monitor.droid = required

    # Waehlt man einen Kopfhoerer als Ausgang, soll dessen Mikrofon mitkommen.
    policy.droid-input-follows-output = required

    # Ueber die Mixer-API erfaehrt der Monitor von Lautstaerkeaenderungen.
    # Im Anruf braucht der HAL sie (set_voice_volume) - die Software-
    # Verstaerkung des Adapters greift dort ins Leere, weil kein PCM fliesst.
    api.mixer = required

    # Der ALSA-Monitor bleibt AN - sonst gaebe es kein USB-Audio: kein
    # USB-C-Headset, kein Dock, kein DAC. Unsichtbar gemacht wird gezielt nur
    # die interne Karte (siehe monitor.alsa.rules unten).
  }
}

# Die rohe ALSA-Karte mt6877-mt6359 ist dasselbe Geraet, das der Android-HAL
# exklusiv haelt. Wuerde eine Anwendung sie direkt oeffnen, kaeme es zum
# Streit ums PCM-Geraet - also verstecken. Alles andere (USB!) bleibt
# sichtbar.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
      { api.alsa.card.name = "mt6877-mt6359" }
      { alsa.card_name = "mt6877-mt6359" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
