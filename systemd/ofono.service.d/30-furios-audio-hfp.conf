# Leave BlueZ' hands-free gateway registration to PipeWire.
#
# ofono's built-in hfp_ag_bluez5 plugin and WirePlumber's native bluez5
# backend both register BlueZ' hfp_ag UUID. Exactly one gets it; the loser
# says so once in the journal and is never heard from again. When WirePlumber
# loses, the Bluetooth card carries only A2DP profiles - no headset-head-unit,
# so no SCO, so neither the headset microphone nor a Bluetooth call works.
#
# ofono starts as a system service long before the user session, so it wins
# almost every boot. Taking the plugin out of ofono decides the question up
# front instead of leaving it to startup order.
#
# The native backend is what our stack needs: see
# /usr/share/wireplumber/wireplumber.conf.d/51-bluez-ofono.conf for why
# bluez5.hfphsp-backend is "native" here. Modem telephony (ril) does not go
# through this plugin and is unaffected.
[Service]
ExecStart=
ExecStart=/usr/sbin/ofonod --nodetach -P hfp_ag_bluez5
