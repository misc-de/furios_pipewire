# PipeWire sends every call to a car kit as call 0 (+CLCC), and a strict car
# drops it: no display, radio keeps playing, no sound. The helper writes a copy
# of libspa-bluez5.so with the index fixed to %t/furios-audio/spa-0.2 - see
# furios-audio-bluez5-fix for why and how.
#
# The copy comes FIRST in the search path, the system directory second:
# everything else still loads from the system, and without a copy (no match
# after a PipeWire update, helper failed) WirePlumber loads the original.
# "-": a failing helper must never keep WirePlumber from starting.
[Service]
ExecStartPre=-/usr/bin/furios-audio-bluez5-fix
Environment=SPA_PLUGIN_DIR=%t/furios-audio/spa-0.2:/usr/lib/@TRIPLET@/spa-0.2
